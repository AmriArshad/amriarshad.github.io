<!doctype html>
<!-- Source for public/og.png (1200×630). See README for how to re-render it. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=block">
<style>
  :root {
    --bg: #11111b; --panel: #181825; --line: #313244; --muted: #7f849c; --fg-soft: #bac2de; --fg: #cdd6f4;
    --accent: #cba6f7; --accent-2: #b4befe; --accent-3: #f5c2e7; --glow: 203, 166, 247; --glow-alpha: 0.3;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: "IBM Plex Mono", monospace; }
  .card { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 520px; }
  .copy { padding: 64px 0 56px 72px; display: flex; flex-direction: column; }
  .label { font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 34px 0 26px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 76px; line-height: 1; letter-spacing: -0.028em; }
  h1 span { color: var(--accent); }
  .lede { font-size: 20px; line-height: 1.55; color: var(--fg-soft); max-width: 30ch; }
  .foot { margin-top: auto; display: flex; align-items: baseline; gap: 22px; }
  .wordmark { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 36px; line-height: 1; letter-spacing: -0.025em; }
  .wordmark span { color: var(--accent); }
  .stage { position: relative; margin: 40px 40px 40px 0; border: 1px solid var(--line); background: var(--panel); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tag { position: absolute; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .tl { left: 16px; top: 13px; } .br { right: 16px; bottom: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <p class="label">IT Operations · Auckland, NZ</p>
      <h1>Building systems that <span>just work</span>.</h1>
      <p class="lede">Infrastructure, automation, websites and generative art.</p>
      <div class="foot"><span class="wordmark">amri<span>.dev</span></span><span class="label">Amri Arshad</span></div>
    </div>
    <div class="stage"><canvas id="c"></canvas><span class="tag tl">knot 2·3</span><span class="tag br">yaw 344° · pitch −26°</span></div>
  </div>
  <script type="module">
    import { SHAPES, buildGeometry, createRenderer } from "../src/scripts/knot.js";
    await document.fonts.load(`500 16px "IBM Plex Mono"`);
    await document.fonts.load(`500 76px "Bricolage Grotesque"`);
    await document.fonts.ready;
    const r = createRenderer(document.getElementById("c"), { minFs: 15, maxFs: 15, fsDiv: 30 });
    r.setGeometry(buildGeometry(SHAPES[0], { nu: 1400, nv: 48 }));
    r.resize();
    const q = new URLSearchParams(location.search); // ?yaw= ?pitch= ?spin= to try other poses
    r.draw(+(q.get("t") ?? 0), +(q.get("yaw") ?? -0.28), +(q.get("pitch") ?? -0.45), +(q.get("spin") ?? 0.35));
    document.body.dataset.ready = "1";
  </script>
</body>
</html>
